[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omniintents"
version = "0.2.0"
description = "Enhanced reference implementation of an OmniIntents-like pipeline (IntentGPT/TaskGPT/AgentGPT)."
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [{name = "OmniIntents Reference"}]

dependencies = [
  "numpy>=1.23",
  "Pillow>=9.0",
  "requests>=2.31",
]

[project.optional-dependencies]
optional = ["soundfile>=0.12", "librosa>=0.10", "torch>=2.0"]

[tool.setuptools.packages.find]
include = ["omniintents*"]
